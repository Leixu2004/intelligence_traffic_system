repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: python -m ruff check --force-exclude
        language: system
        types: [python]
      - id: ruff-format-check
        name: ruff format check
        entry: python -m ruff format --check --force-exclude
        language: system
        types: [python]
      - id: acceptance-tests
        name: acceptance gate tests
        entry: python -m unittest discover -s acceptance/tests -t . -p test_*.py
        language: system
        pass_filenames: false
        types: [python]
